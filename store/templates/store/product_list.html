{% extends 'store/base.html' %}{% block title %}Shop | Zymaya{% endblock %}{% block content %}
<section class="shop-layout"><aside class="filters"><h3>Categories</h3><a class="filter-link{% if not active_category %} active{% endif %}" href="{% url 'store:product_list' %}">All</a>{% for category in categories %}<a class="filter-link{% if active_category == category %} active{% endif %}" href="{{ category.get_absolute_url }}">{{ category.name }}</a>{% endfor %}</aside><div>{% include 'store/includes/product_grid.html' with products=products %}</div></section>
{% endblock %}
